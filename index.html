<!doctype html>
<html lang="th">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>PictureGPS Map – แสดงเส้นทางรูปภาพบนแผนที่</title>
        <meta
            name="description"
            content="อัปโหลดรูปภาพที่มีข้อมูล GPS แล้วดูตำแหน่งและเส้นทางบนแผนที่"
        />
        <!-- E11: PWA -->
        <link rel="manifest" href="manifest.json" />
        <link rel="icon" type="image/svg+xml" href="favicon.svg" />
        <meta name="theme-color" content="#141414" />

        <!-- Leaflet CSS -->
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
            crossorigin=""
        />
        <!-- D12: Leaflet MarkerCluster CSS -->
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
            crossorigin=""
        />
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
            crossorigin=""
        />

        <!-- Google Fonts: Sarabun (Thai) -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap"
            rel="stylesheet"
        />

        <!-- App CSS -->
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <!-- ===== HEADER ===== -->
        <header class="header">
            <div class="header-inner">
                <div class="logo">
                    <svg
                        class="logo-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <path
                            d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"
                            fill="currentColor"
                        />
                    </svg>
                    <span class="logo-text"
                        >PictureGPS<span class="logo-accent">Map</span></span
                    >
                </div>
                <div class="header-right">
                    <span id="header-stats" class="header-stats"></span>
                    <button id="btn-clear" class="btn btn-ghost btn-sm hidden">
                        🗑️ ล้างทั้งหมด
                    </button>
                </div>
            </div>
        </header>

        <!-- ===== MAIN ===== -->
        <main class="main">
            <!-- Upload Zone -->
            <section id="upload-zone" class="upload-zone">
                <div id="drop-area" class="drop-area">
                    <div class="drop-icon">
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                        >
                            <rect
                                x="3"
                                y="3"
                                width="18"
                                height="18"
                                rx="3"
                                stroke="currentColor"
                                stroke-width="1.5"
                            />
                            <circle
                                cx="8.5"
                                cy="8.5"
                                r="1.5"
                                stroke="currentColor"
                                stroke-width="1.5"
                            />
                            <path
                                d="M21 15l-5-5L5 21"
                                stroke="currentColor"
                                stroke-width="1.5"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />
                            <path
                                d="M14 10l3 3"
                                stroke="currentColor"
                                stroke-width="1.5"
                                stroke-linecap="round"
                            />
                        </svg>
                    </div>
                    <h2 class="drop-title">อัปโหลดรูปภาพ GPS</h2>
                    <p class="drop-subtitle">ลากและวางรูปภาพที่นี่ หรือ</p>
                    <button class="btn btn-primary" id="btn-upload">
                        📁 เลือกรูปภาพ
                    </button>
                    <p class="drop-formats">
                        รองรับ JPEG · PNG · TIFF · HEIC และอื่นๆ
                    </p>
                    <input
                        type="file"
                        id="file-input"
                        accept="image/*"
                        multiple
                        hidden
                    />

                    <!-- Divider -->
                    <div class="drop-divider">
                        <span class="drop-divider-line"></span>
                        <span class="drop-divider-text">หรือเปิดไฟล์ Track</span>
                        <span class="drop-divider-line"></span>
                    </div>

                    <!-- Load GPX / KML -->
                    <div class="drop-track-btns">
                        <button class="btn btn-track" id="btn-load-gpx-home">
                            🗺️ Load GPX
                        </button>
                        <button class="btn btn-track" id="btn-load-kml-home">
                            📂 Load KML
                        </button>
                    </div>
                    <p class="drop-formats">รองรับไฟล์ .gpx และ .kml</p>

                    <!-- Hidden file input for GPX/KML on home screen -->
                    <input
                        type="file"
                        id="gpx-kml-home-input"
                        accept=".gpx,.kml"
                        hidden
                    />
                </div>
            </section>

            <!-- App Content (แสดงหลัง upload) -->
            <div id="app-content" class="app-content hidden">
                <!-- Map Section -->
                <div class="map-section">
                    <div class="map-toolbar">
                        <div class="map-toolbar-left">
                            <button
                                class="btn btn-primary btn-sm"
                                id="btn-add-more"
                            >
                                ➕ <span class="btn-label">เพิ่มรูป</span>
                            </button>
                            <!-- C6: Search Box -->
                            <div class="search-box" id="search-box">
                                <input
                                    type="text"
                                    id="search-input"
                                    class="search-input"
                                    placeholder="🔍 ค้นหาสถานที่..."
                                    autocomplete="off"
                                />
                                <div id="search-results" class="search-results hidden"></div>
                            </div>
                        </div>
                        <div class="map-toolbar-right">
                            <button
                                class="btn btn-secondary btn-sm"
                                id="btn-layer-toggle"
                                title="สลับแผนที่"
                            >
                                🛰️ <span class="btn-label">ดาวเทียม</span>
                            </button>
                            <button
                                class="btn btn-secondary btn-sm"
                                id="btn-fit-bounds"
                            >
                                🔍 <span class="btn-label">ซูมให้พอดี</span>
                            </button>
                            <div class="toolbar-sep"></div>
                            <!-- GPX Split Button -->
                            <div class="btn-split-group" id="gpx-split-group">
                                <button
                                    class="btn btn-secondary btn-sm btn-split-main"
                                    id="btn-export-gpx"
                                    title="Export GPX"
                                >📥 <span class="btn-label">GPX</span></button>
                                <button
                                    class="btn btn-secondary btn-sm btn-split-arrow"
                                    id="btn-gpx-arrow"
                                    title="ตัวเลือก GPX"
                                    aria-haspopup="true"
                                    aria-expanded="false"
                                >▾</button>
                                <div class="btn-split-menu" id="gpx-menu" role="menu">
                                    <button class="split-menu-item" id="gpx-menu-export">📥 Export GPX</button>
                                    <button class="split-menu-item" id="gpx-menu-load">📂 Load GPX</button>
                                </div>
                            </div>
                            <!-- KML Split Button -->
                            <div class="btn-split-group" id="kml-split-group">
                                <button
                                    class="btn btn-secondary btn-sm btn-split-main"
                                    id="btn-export-kml"
                                    title="Export KML"
                                >📤 <span class="btn-label">KML</span></button>
                                <button
                                    class="btn btn-secondary btn-sm btn-split-arrow"
                                    id="btn-kml-arrow"
                                    title="ตัวเลือก KML"
                                    aria-haspopup="true"
                                    aria-expanded="false"
                                >▾</button>
                                <div class="btn-split-menu" id="kml-menu" role="menu">
                                    <button class="split-menu-item" id="kml-menu-export">📤 Export KML</button>
                                    <button class="split-menu-item" id="kml-menu-load">📂 Load KML</button>
                                </div>
                            </div>
                            <!-- Hidden file input for GPX/KML import -->
                            <input type="file" id="gpx-kml-input" accept=".gpx,.kml" hidden>

                            <!-- D8: PDF Export -->
                            <button
                                class="btn btn-secondary btn-sm"
                                id="btn-export-pdf"
                                title="Export PDF Report"
                            >
                                📄 <span class="btn-label">PDF</span>
                            </button>

                            <!-- D13: Save Map Split Button -->
                            <div class="btn-split-group" id="save-split-group">
                                <button
                                    class="btn btn-secondary btn-sm btn-split-main"
                                    id="btn-save-map"
                                    title="บันทึกแผนที่"
                                >💾 <span class="btn-label">บันทึก</span></button>
                                <button
                                    class="btn btn-secondary btn-sm btn-split-arrow"
                                    id="btn-save-arrow"
                                    title="ตัวเลือกบันทึก"
                                    aria-haspopup="true"
                                    aria-expanded="false"
                                >▾</button>
                                <div class="btn-split-menu" id="save-menu" role="menu">
                                    <button class="split-menu-item" id="save-menu-map">🗺️ เฉพาะแผนที่</button>
                                    <button class="split-menu-item" id="save-menu-full">📸 ทั้งหน้าจอ</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div id="map"></div>

                    <!-- Timeline Bar -->
                    <div id="timeline-bar" class="timeline-bar hidden">
                        <button
                            id="btn-tl-prev"
                            class="btn-tl-nav"
                            title="รูปก่อนหน้า"
                        >
                            &#9664;
                        </button>
                        <div class="tl-thumb-wrap">
                            <img
                                id="tl-thumb"
                                class="tl-thumb-img"
                                src=""
                                alt=""
                            />
                            <div id="tl-badge" class="tl-badge">1</div>
                        </div>
                        <div class="tl-slider-wrap">
                            <div id="tl-info" class="tl-info"></div>
                            <input
                                type="range"
                                id="timeline-slider"
                                class="timeline-slider"
                                min="1"
                                max="1"
                                value="1"
                            />
                        </div>
                        <button
                            id="btn-tl-next"
                            class="btn-tl-nav"
                            title="รูปถัดไป"
                        >
                            &#9654;
                        </button>
                        <span id="tl-counter" class="tl-counter">1 / 1</span>
                    </div>
                </div>

                <!-- C7: Sidebar Resizer -->
                <div id="sidebar-resizer" class="sidebar-resizer" title="ลากเพื่อปรับขนาด"></div>

                <!-- Sidebar -->
                <aside class="sidebar">
                    <div class="sidebar-header">
                        <div class="sidebar-title-row">
                            <h3 class="sidebar-title">📸 รายการรูปภาพ</h3>
                            <span id="photo-count-badge" class="count-badge"
                                >0</span
                            >
                        </div>
                        <!-- B10: Filter + Sort Pills -->
                        <div class="filter-sort-row">
                            <div class="filter-pills">
                                <button class="filter-pill active" data-filter="all">ทั้งหมด</button>
                                <button class="filter-pill" data-filter="gps">มี GPS</button>
                                <button class="filter-pill" data-filter="nogps">ไม่มี GPS</button>
                            </div>
                            <div class="sort-pills">
                                <button class="sort-pill active" data-sort="time">⏱ เวลา</button>
                                <button class="sort-pill" data-sort="name">🔤 ชื่อ</button>
                            </div>
                        </div>
                        <div id="route-stats" class="route-stats hidden">
                            <span id="route-distance"></span>
                            <span class="route-stats-sep">·</span>
                            <span id="route-timerange"></span>
                        </div>
                        <!-- Imported Track Info Panel -->
                        <div id="imported-track-info" class="imported-track-info hidden">
                            <div class="imported-track-header">
                                <span class="imported-track-icon">📂</span>
                                <span id="imported-track-name" class="imported-track-name">Track</span>
                                <button id="btn-clear-track" class="imported-track-close" title="ลบ track ที่ import">✕</button>
                            </div>
                            <div class="imported-track-stats">
                                <span id="imported-track-pts"></span>
                                <span class="route-stats-sep">·</span>
                                <span id="imported-track-dist"></span>
                            </div>
                        </div>
                        <div id="alert-no-gps" class="alert-box hidden">
                            ⚠️ <span id="alert-no-gps-text"></span>
                        </div>
                    </div>
                    <div id="photo-list" class="photo-list">
                        <!-- Photo cards จะถูก inject ที่นี่ -->
                    </div>
                </aside>
            </div>
        </main>

        <!-- Loading Overlay -->
        <div id="loading-overlay" class="loading-overlay hidden">
            <div class="loading-box">
                <div class="spinner"></div>
                <p id="loading-text" class="loading-text">กำลังประมวลผล...</p>
            </div>
        </div>

        <!-- B14: Toast Container -->
        <div id="toast-container"></div>

        <!-- ===== SCRIPTS ===== -->
        <!-- Leaflet.js -->
        <script
            src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            crossorigin=""
        ></script>
        <!-- D12: Leaflet MarkerCluster -->
        <script
            src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
            crossorigin=""
        ></script>
        <!-- exifr – อ่าน EXIF/GPS จากรูปภาพ -->
        <script
            src="https://unpkg.com/exifr@7.1.3/dist/full.umd.cjs"
            crossorigin=""
        ></script>
        <!-- html2canvas – บันทึกแผนที่เป็นรูป -->
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
            crossorigin=""
        ></script>
        <!-- heic2any – แปลง HEIC → JPEG สำหรับ browser ที่ไม่รองรับ -->
        <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
        <!-- D8: jsPDF – Export PDF -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin=""></script>
        <!-- App Logic -->
        <script src="js/app.js"></script>
    </body>
</html>
